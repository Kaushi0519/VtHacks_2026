[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Lattice: zero-trust gateway + control plane for AI agent networks"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.11",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
